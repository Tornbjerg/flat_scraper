name: flatwatch

on:
  schedule:
    # Only one schedule: the poll. It sends the daily digest itself once past the
    # cutoff (see due_for_digest), so a separate digest cron would double-send.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'poll (default) or digest'
        type: choice
        options: [poll, digest]
        default: poll

permissions:
  contents: write            # to commit seen.json / pending.json back

concurrency:
  group: flatwatch           # never let a poll and the digest race on the state commit

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python flats.py ${{ inputs.mode == 'digest' && '--digest' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Persist state
        run: |
          git config user.name flatwatch
          git config user.email noreply@github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "state $(date -u +%FT%TZ)"
          git pull --rebase --autostash
          git push

# registered via nudge
